on:
  pull_request:
    branches:
      - main

jobs:
  PR_CI:
    name: PR CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version: "16.x"
          cache: "yarn"

      - name: Install Deps
        run: yarn install

      - name: ESLint
        run: yarn eslint .

      - name: Prettier
        run: yarn prettier .

      - name: Test
        run: yarn coverage


      - name: Build Lib
        run: yarn build

      - name: Build Storybook
        run: yarn build-storybook
