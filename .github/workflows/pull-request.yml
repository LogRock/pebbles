on:
  pull_request:
    branches:
      - main

jobs:
  PR_CI:
    name: PR CI
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v2

      - name: Use Node.js
        uses: actions/setup-node@v2
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 8

      - name: Install Deps
        run: pnpm install

      - name: ESLint
        run: pnpm eslint .

      - name: Prettier
        run: pnpm prettier .

      - name: Test
        run: pnpm coverage

      - name: Build Lib
        run: pnpm build

      - name: Build Storybook
        run: pnpm build-storybook
